name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

# The npm workspace root is discoverer-neo/, not the repo root — this
# workflow file used to live inside discoverer-neo/.github/workflows/,
# where GitHub Actions never discovers it at all (workflows are only
# read from <repo-root>/.github/workflows/). Moved here so CI actually
# runs; every job's commands now need to point at that subdirectory.
defaults:
  run:
    working-directory: discoverer-neo

jobs:
  backend:
    name: Backend (lint, typecheck, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: discoverer
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: discoverer_neo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U discoverer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Both point at the *_test* database on purpose. `src/__tests__/setup/
      # test-database.ts` refuses to run a suite against a database whose name
      # does not end in `_test` — the suites clean up with unscoped DELETEs —
      # and `scripts/setup-test-db.mjs` reads TEST_DATABASE_URL, falling back
      # to the local dev password when it is unset. Unset was the bug: every
      # backend Test step so far died in `pretest` with a Postgres 28P01
      # before a single test ran.
      DATABASE_URL: postgres://discoverer:ci_password@localhost:5432/discoverer_neo_test
      TEST_DATABASE_URL: postgres://discoverer:ci_password@localhost:5432/discoverer_neo_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-not-for-production-use-only
      ENCRYPTION_KEY: ci-test-encryption-key-32chars-minimum
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: discoverer-neo/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The backend imports @discoverer-neo/core; jest resolves it straight
      # to TS source (see backend/jest.config.js), but `tsc`/`build` need the
      # compiled .d.ts/dist — same ordering as backend/Dockerfile's build stage.
      - name: Build migrate workspace
        run: npm run build --workspace @discoverer-neo/core

      - name: Lint
        run: npm run lint --workspace @discoverer-neo/backend

      - name: Typecheck
        run: npm run typecheck --workspace @discoverer-neo/backend

      # No separate migrate step: `pretest` runs scripts/setup-test-db.mjs,
      # which creates the test database and applies every migration to it.
      # A `db:migrate` before that would target a database that does not
      # exist yet.
      - name: Test
        run: npm test --workspace @discoverer-neo/backend -- --coverage

  frontend:
    name: Frontend (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: discoverer-neo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspace @discoverer-neo/frontend

      - name: Typecheck
        run: npm run typecheck --workspace @discoverer-neo/frontend

      - name: Check translation completeness
        run: node scripts/i18n-check.mjs pt-PT fr-FR es-ES

      - name: Test
        run: npm test --workspace @discoverer-neo/frontend -- --run --coverage

      - name: Build
        run: npm run build --workspace @discoverer-neo/frontend

  migrate:
    name: Migrate CLI (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: discoverer-neo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspace @discoverer-neo/core

      - name: Typecheck
        run: npm run typecheck --workspace @discoverer-neo/core

      - name: Test
        run: npm test --workspace @discoverer-neo/core -- --coverage
