# =============================================
# Discoverer Neo — SSL-terminating reverse proxy
# =============================================
# Fronts the `frontend` (static SPA + SPA-local /api/ proxy, see
# frontend/nginx.conf) and `backend` containers on docker-compose.prod.yml's
# network. This is the only service that publishes ports to the host.
#
# Certificates expected at /etc/nginx/certs (bind-mounted from ./certs — see
# docker-compose.prod.yml):
#   fullchain.pem   — leaf cert + intermediates
#   privkey.pem     — private key
#   chain.pem       — issuer chain only, for OCSP stapling's trust anchor
#
# Real certs (Let's Encrypt):
#   certbot certonly --standalone -d your-domain.example
#   cp /etc/letsencrypt/live/your-domain.example/{fullchain,privkey,chain}.pem ./certs/
#   (renewal: re-run certbot and `docker compose -f docker-compose.prod.yml restart nginx`)
#
# Local/self-signed testing (browsers will warn — expected):
#   mkdir -p certs && openssl req -x509 -nodes -days 365 \
#     -newkey rsa:2048 -keyout certs/privkey.pem -out certs/fullchain.pem \
#     -subj "/CN=localhost"
#   cp certs/fullchain.pem certs/chain.pem   # self-signed has no separate issuer;
#                                             # OCSP stapling simply won't have
#                                             # anything to staple and is skipped
# =============================================

upstream frontend_app {
    server frontend:80;
}

upstream backend_app {
    server backend:3000;
}

# Rate limiting for the API surface — a reverse-proxy-level backstop, not a
# substitute for the backend's own auth/authorization. Keyed by IP.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Container healthcheck target (docker-compose.prod.yml's `nginx`
    # service) — must stay plain HTTP so `wget http://localhost/...` inside
    # the container succeeds without a cert.
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ACME HTTP-01 challenge path, for certbot renewal without stopping nginx.
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # Everything else: redirect to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Modern ciphers — TLS 1.2 (broad client support) + 1.3 only.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling — no-ops harmlessly for a self-signed cert (no responder
    # to staple from); real effect only with a CA-issued chain.pem present.
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/nginx/certs/chain.pem;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # HSTS — only sent over an already-HTTPS connection, so this never traps
    # a browser into a broken redirect loop on first HTTP contact.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
    gzip_proxied any;

    client_max_body_size 20m;

    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # API — proxied straight to the backend rather than through the
    # frontend's own /api/ proxy, saving a hop.
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;

        proxy_pass http://backend_app/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Matches frontend/nginx.conf's timeouts — long-running Oracle EUL
        # imports and exports need headroom beyond nginx's defaults.
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }

    # Backend's own /metrics and /health, reached directly for infra tooling
    # that expects them at the root rather than under /api. Not linked from
    # the SPA; harmless to expose behind the same TLS termination as
    # everything else, but keep off a public DNS name if Prometheus itself
    # runs outside this network.
    location = /health {
        proxy_pass http://backend_app/health;
        proxy_set_header Host $host;
    }

    location = /metrics {
        proxy_pass http://backend_app/metrics;
        proxy_set_header Host $host;
    }

    # Hashed static assets (content-hashed filenames from the Vite build) —
    # safe to cache aggressively; a new deploy ships new filenames.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://frontend_app;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Everything else — the SPA shell + its own client-side routing.
    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
