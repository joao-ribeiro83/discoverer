openapi: 3.0.3
info:
  title: Discoverer Neo API
  description: REST API for Oracle Discoverer Neo metadata management backend. Manage data sources, business areas, folders, items, joins, hierarchies, and custom functions.
  version: 0.1.0
  contact:
    name: Discoverer Neo
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token returned by POST /api/auth/login
  schemas:
    def-0:
      type: object
      properties:
        statusCode:
          type: number
        code:
          type: string
        error:
          type: string
        message:
          type: string
      title: HttpError
paths:
  /health:
    get:
      tags:
        - Health
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  version:
                    type: string
                  uptime:
                    type: number
                  database:
                    type: string
                    enum:
                      - connected
                      - disconnected
                  redis:
                    type: string
                    enum:
                      - connected
                      - disconnected
                  timestamp:
                    type: string
                    format: date-time
  /api/health:
    get:
