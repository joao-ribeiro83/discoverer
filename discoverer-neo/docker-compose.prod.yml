# =============================================
# Discoverer Neo — Production Docker Compose
# =============================================
# Differences from docker-compose.yml (the dev/general-purpose file):
#   - Only `nginx` publishes ports to the host (80/443). Postgres, Redis, the
#     backend, and the frontend's own Nginx are reachable only on the compose
#     network — the SSL-terminating reverse proxy is the single public entry
#     point.
#   - Resource limits + reservations on every service, so one runaway
#     container (e.g. a pathological export query) cannot starve the others
#     on a shared host.
#   - JSON-file logging capped with max-size/max-file, so container logs
#     cannot fill the host disk over a long uptime.
#   - Healthchecks on every service, with `depends_on: condition:
#     service_healthy` so nothing starts against a dependency that is up but
#     not yet ready.
#   - No source/dev-tool volume mounts — this file only ever runs built
#     images.
#
# Usage:
#   cp .env.example .env   # fill in real secrets — see README/SECURITY notes
#   mkdir -p certs && place fullchain.pem + privkey.pem there (see
#     nginx/nginx-ssl.conf's header for how to obtain or self-sign them)
#   docker compose -f docker-compose.prod.yml up -d --build
#
# `.env` is read directly (not `.env.example`) — the placeholder secrets in
# the example file must never reach a real deployment.
# =============================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  postgres:
    image: postgres:16-alpine
    container_name: discoverer-neo-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-discoverer_neo}
      POSTGRES_USER: ${POSTGRES_USER:-discoverer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env for production}
    # No host port publish — only the backend (on the compose network) talks
    # to Postgres. Use `docker compose exec postgres psql ...` for shell access.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-discoverer}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: discoverer-neo-redis
    restart: unless-stopped
    # RDB persistence (default redis.conf: save 3600 1 / 300 100 / 60 10000)
    # is enough for this app's use of Redis — a cache + BullMQ queue, neither
    # of which needs AOF durability guarantees.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      # Rebuild with --build-arg INSTALL_ORACLE_CLIENT=true (and set
      # ORACLE_THICK_MODE=true below) only if a source EUL is older than
      # Oracle 12.1 — see backend/Dockerfile's header.
    container_name: discoverer-neo-backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-discoverer}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-discoverer_neo}
      REDIS_URL: redis://redis:6379
      EXPORT_DIR: /app/exports
      SCHEDULE_RESULT_DIR: /app/scheduled-results
      ORACLE_THICK_MODE: ${ORACLE_THICK_MODE:-false}
    # No host port publish — nginx is the only public entry point; the
    # backend is reached at http://backend:3000 on the compose network.
    volumes:
      - export_files:/app/exports
      - scheduled_results_files:/app/scheduled-results
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Inherited from backend/Dockerfile's HEALTHCHECK; restated here so the
      # interval/start_period are tuned for this file's dependency ordering
      # rather than the image's stand-alone defaults.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: discoverer-neo-frontend
    restart: unless-stopped
    # No host port publish — served through nginx.
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M

  nginx:
    image: nginx:1.27-alpine
    container_name: discoverer-neo-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      # fullchain.pem + privkey.pem (and, for OCSP stapling, the issuer chain
      # as chain.pem). See nginx/nginx-ssl.conf's header for how to obtain
      # these (Let's Encrypt / certbot) or self-sign them for local testing.
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M

volumes:
  postgres_data:
  redis_data:
  export_files:
  scheduled_results_files:
