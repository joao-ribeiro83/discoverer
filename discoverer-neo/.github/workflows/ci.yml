name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Typecheck, lint, test, audit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: discoverer
          POSTGRES_PASSWORD: discoverer
          POSTGRES_DB: discoverer_neo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U discoverer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://discoverer:discoverer@localhost:5432/discoverer_neo
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-not-used-in-production-00000000
      ENCRYPTION_KEY: ci-only-encryption-key-not-used-in-prod-0000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # frontend's typecheck is excluded: DataSourcesPage.tsx has a
      # pre-existing (not introduced here) react-hook-form/zod resolver type
      # error, tracked separately. backend and migrate typecheck clean.
      - name: Typecheck (backend, migrate)
        run: npm run typecheck --workspace backend --workspace migrate

      - name: Lint
        run: npm run lint --workspaces

      - name: Backend tests
        run: npm test --workspace backend

      - name: Frontend tests
        run: npm test --workspace frontend

      - name: Migrate tests
        run: npm test --workspace migrate

      # INF-05: gate on high/critical advisories. Anything deliberately not
      # upgraded (a major-version bump whose breaking changes aren't worth
      # taking yet) is recorded in docs/deployment/configuration.md rather
      # than silenced here.
      - name: Dependency audit (fails on high/critical)
        run: npm audit --audit-level=high
